<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TURF MATRIX | 2026-09-05/06 Race Data</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:1500px;overflow:hidden}
body{background:#f4f6f9;color:#071631;font-family:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;letter-spacing:0}
.page{--accent:#08a8c8;--accent-soft:#e7f8fb;width:1200px;height:1500px;padding:30px 38px 24px;background:#f7f8fa}
.top{height:76px;display:grid;grid-template-columns:120px 1fr 120px;align-items:center;border-bottom:3px solid #0b2a5b}
.mark{font:900 italic 43px/1 Arial;color:#0b2a5b}.brand{text-align:center}.brand strong{display:block;font:900 34px/1 Arial;color:#061a3b}.brand span{display:block;margin-top:7px;font:700 11px/1 Arial;letter-spacing:4px;color:#5d6c83}.edition{text-align:right;font:700 13px/1.45 Consolas;color:#53647e}
.hero{height:240px;margin-top:15px;background:#fff;border:1px solid #bcc8d8;border-top:7px solid var(--accent);display:grid;grid-template-columns:235px 1fr 285px;gap:24px;align-items:center;padding:20px 24px}
.course{text-align:center}.venue{display:inline-block;background:#0b2a5b;color:#fff;padding:8px 14px;border-radius:3px;font:800 13px/1 Arial;letter-spacing:1px}.venue em{font-style:normal;color:#8fe7f4}.track{position:relative;width:188px;height:92px;margin:14px auto 8px;border:11px solid var(--accent);border-radius:50%;box-shadow:inset 0 0 0 2px #d4dce7}.track:before{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;background:#9aa9bd}.track span{position:absolute;inset:0;display:grid;place-items:center;font:900 24px/1 Consolas;color:#0b2a5b}.course-meta{font-size:14px;font-weight:800;color:#5b6b82}.race-title .series{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:1px}.race-title h1{margin:7px 0 6px;font-size:39px;line-height:1.12;letter-spacing:0}.grade{display:inline-block;vertical-align:6px;margin-left:9px;padding:5px 9px;background:var(--accent);color:#fff;border-radius:3px;font:900 16px/1 Arial}.condition{font-size:17px;line-height:1.45;font-weight:800;color:#34465f}.tags{display:flex;gap:7px;margin-top:13px}.tag{padding:5px 9px;border:1px solid #bfcbd9;background:#f7f9fc;border-radius:3px;font-size:12px;font-weight:800;color:#3c4c65}.insight{align-self:stretch;border-left:4px solid var(--accent);background:var(--accent-soft);padding:17px 17px}.insight b{display:block;font:900 13px/1 Arial;color:var(--accent);letter-spacing:1px}.insight strong{display:block;margin-top:11px;font-size:21px;line-height:1.3}.insight p{margin:8px 0 0;font-size:14px;line-height:1.65;font-weight:700;color:#3e4e65}
.section-head{height:50px;display:flex;align-items:end;justify-content:space-between;padding:0 3px 9px;border-bottom:2px solid #0b2a5b}.section-head h2{margin:0;font-size:22px}.section-head span{font:700 12px/1 Arial;color:#748198;letter-spacing:1px}
.keys-wrap{margin-top:15px}.keys{height:162px;background:#fff;border:1px solid #c7d0dc;border-top:0;display:grid;grid-template-columns:repeat(4,1fr)}.key{padding:13px 17px 12px;border-right:1px solid #d5dce5}.key:last-child{border-right:0}.key-label{font-size:13px;font-weight:900;color:#66758c}.key-value{margin-top:7px;font:900 28px/1.1 Consolas;color:var(--accent)}.key-title{margin-top:5px;font-size:15px;font-weight:900;line-height:1.3}.key-note{margin-top:4px;font-size:11.5px;font-weight:700;line-height:1.35;color:#5d6b7f}
.main{height:655px;margin-top:15px;display:grid;grid-template-columns:1.08fr .92fr;gap:17px}.column{display:grid;gap:17px}.column.left{grid-template-rows:360px 278px}.column.right{grid-template-rows:386px 252px}.panel{background:#fff;border:1px solid #c7d0dc;padding:18px 20px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.panel-title h2{margin:0;font-size:20px}.panel-title span{font:800 11px/1 Arial;color:var(--accent);letter-spacing:1px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{padding:7px 8px;border-bottom:2px solid #8fa0b6;text-align:left;color:#5a687c;font-size:12px}.table td{padding:8px;border-bottom:1px solid #e0e5eb;font-weight:700}.table td:last-child,.table th:last-child{text-align:right}.table tr.focus td{background:var(--accent-soft);color:#0a3153}.table .rate{font:900 16px Consolas;color:var(--accent)}.panel-note{margin:11px 0 0;font-size:13px;line-height:1.5;font-weight:800;color:#42516a}
.deep-list{display:grid;gap:11px}.deep{border-left:4px solid var(--accent);padding:8px 12px;background:#fafbfd}.deep small{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.5px}.deep strong{display:block;margin:3px 0 3px;font-size:17px}.deep p{margin:0;font-size:13px;line-height:1.5;font-weight:700;color:#4a5a70}
.horse-list{display:grid;gap:9px}.horse{padding:10px 12px;border:1px solid #d5dce5;border-left:4px solid var(--accent);background:#fff}.horse-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.horse strong{font-size:17px}.horse .fit{white-space:nowrap;font-size:11px;font-weight:900;color:var(--accent)}.blood{margin-top:3px;font-size:11px;font-weight:800;color:#65748a}.horse p{margin:5px 0 0;font-size:12px;line-height:1.45;font-weight:700;color:#34445c}.pre-note{font-size:11px;font-weight:800;color:#6e7b8f;margin:-4px 0 10px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matrix-item{padding:11px 12px;background:#f7f9fc;border-left:3px solid #0b2a5b}.matrix-item b{display:block;font-size:13px}.matrix-item strong{display:block;margin-top:4px;font:900 19px Consolas;color:var(--accent)}.matrix-item span{display:block;margin-top:4px;font-size:11px;line-height:1.4;color:#5d6d83;font-weight:700}
.takeaway{height:112px;margin-top:15px;background:#0b2a5b;color:#fff;display:grid;grid-template-columns:184px 1fr;align-items:center;padding:16px 26px;border-left:8px solid var(--accent)}.takeaway b{font:900 14px/1 Arial;letter-spacing:1px;color:#7fe1ee}.takeaway p{margin:0;font-size:18px;line-height:1.5;font-weight:900}.footer{height:52px;display:flex;justify-content:space-between;align-items:end;padding:0 3px 2px;color:#69778b;font-size:10px;line-height:1.4}.footer b{font:900 14px Arial;color:#0b2a5b;letter-spacing:1px}
</style>
</head>
<body><main class="page" id="page"></main>
<script>

    deep:[
      ["POPULARITY","上位3頭だけでは完結しない","1〜3番人気が3着以内を独占した年は過去10年で1度だけ。中穴・大穴の混入が基本形。"],
      ["DRAW","内枠と5枠、8枠に別の強み","1枠は3着内率トップ、5枠は4勝、8枠は2着4回。枠の優劣を一方向で決めない。"]

      ["レザベーション","同舞台重賞V","ダノンプレミアム × ジャングルポケット","中山芝1600mのニュージーランドT勝ち。前走NHKマイルC6着。"],

const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const keyHtml=([label,value,title,note])=>`<article class="key"><div class="key-label">${escapeHtml(label)}</div><div class="key-value">${escapeHtml(value)}</div><div class="key-title">${escapeHtml(title)}</div><div class="key-note">${escapeHtml(note)}</div></article>`;
const horseHtml=([name,fit,blood,detail])=>`<article class="horse"><div class="horse-top"><strong>${escapeHtml(name)}</strong><span class="fit">${escapeHtml(fit)}</span></div><div class="blood">${escapeHtml(blood)}</div><p>${escapeHtml(detail)}</p></article>`;

const slug=new URLSearchParams(location.search).get("race")||"shion";
const race=races[slug]||races.shion;
document.documentElement.style.setProperty("--accent",race.accent);
const page=document.getElementById("page");
page.style.setProperty("--accent",race.accent);page.style.setProperty("--accent-soft",race.soft);
page.innerHTML=`
  <header class="top"><div class="mark">TM</div><div class="brand"><strong>TURF MATRIX</strong><span>RACE INTELLIGENCE PLATFORM</span></div><div class="edition">09.03<br>DATA EDITION</div></header>
  <section class="hero">
    <div class="course"><span class="venue">${race.venue} <em>${race.venueEn}</em></span><div class="track"><span>${race.distance}</span></div><div class="course-meta">${race.courseMeta}</div></div>
    <div class="race-title"><div class="series">${race.series}</div><h1>${race.title}<span class="grade">${race.grade}</span></h1><div class="condition">${race.date}<br>${race.condition}</div><div class="tags">${race.tags.map(tag=>`<span class="tag">${tag}</span>`).join("")}</div></div>
    <div class="insight"><b>COURSE INSIGHT</b><strong>${race.insightTitle}</strong><p>${race.insight}</p></div>
  </section>
  <section class="keys-wrap"><div class="section-head"><h2>数字で見る好走の鍵</h2><span>JRA OFFICIAL / PAST 10 YEARS</span></div><div class="keys">${race.keys.map(keyHtml).join("")}</div></section>
  <section class="main">
    <div class="column left">
      <section class="panel"><div class="panel-title"><h2>${race.tableTitle}</h2><span>${race.tableTag}</span></div><table class="table"><thead><tr><th>区分</th><th>成績</th><th>3着内率</th></tr></thead><tbody>${race.tableRows.map(([label,record,rate,focus])=>`<tr class="${focus?"focus":""}"><td>${label}</td><td>${record}</td><td class="rate">${rate}</td></tr>`).join("")}</tbody></table><p class="panel-note">${race.tableNote}</p></section>
      <section class="panel"><div class="panel-title"><h2>数字の奥にある傾向</h2><span>DEEP READ</span></div><div class="deep-list">${race.deep.map(([tag,title,text])=>`<article class="deep"><small>${tag}</small><strong>${title}</strong><p>${text}</p></article>`).join("")}</div></section>
    </div>
    <div class="column right">
      <section class="panel"><div class="panel-title"><h2>登録馬の該当材料</h2><span>FIELD CHECK</span></div><p class="pre-note">現時点の登録馬から事実を照合。予想印ではありません。</p><div class="horse-list">${race.horses.map(horseHtml).join("")}</div></section>
      <section class="panel"><div class="panel-title"><h2>もう一つの見方</h2><span>DATA MATRIX</span></div><div class="matrix">${race.matrix.map(([label,value,note])=>`<div class="matrix-item"><b>${label}</b><strong>${value}</strong><span>${note}</span></div>`).join("")}</div></section>
    </div>
  </section>
  <section class="takeaway"><b>KEY TAKEAWAY</b><p>${race.takeaway}</p></section>
  <footer class="footer"><span>出典：JRA公式「2026年データ分析」「出走馬情報」「競馬場コース紹介」｜過去10年＝2016〜2025年｜出馬表確定前データ</span><b>TURF MATRIX</b></footer>`;

</body>
</html>
